name: Validate MCT

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Verify PWA assets are published
        run: |
          set -e
          for file in dist/index.html dist/manifest.webmanifest dist/icon.svg dist/sw.js; do
            test -f "$file" || { echo "Missing build output: $file"; exit 1; }
          done
          test -f dist/fonts/vazirmatn-arabic-wght-normal.woff2
          echo "PWA assets are present in dist/."
