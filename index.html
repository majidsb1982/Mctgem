<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5fe0">
  <meta name="description" content="دستیار گروه درمانی — My-Class-Track">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MCT">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/vazirmatn-arabic-wght-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/vazirmatn-latin-wght-normal.woff2">
  <title>My-Class-Track — دستیار گروه درمانی</title>

  <style>
    /* Tokens are duplicated here (minimal subset) so the boot screen can be
       painted with the right theme/accent before the app bundle loads. */
    :root {
      --accent: #2f5fe0;
      --bg: #fafbfc;
      --surface: #ffffff;
      --ink: #1b2230;
      --muted: #5d6779;
      --line: #e4e7ec;
    }
    [data-accent='teal']   { --accent: #0f9b8e; }
    [data-accent='purple'] { --accent: #7c3aed; }
    [data-accent='warm']   { --accent: #c96a2b; }
    .dark {
      --bg: #0d1219;
      --surface: #161d27;
      --ink: #f2f5f9;
      --muted: #a7b1c0;
      --line: #2b3542;
    }

    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', Tahoma, system-ui, -apple-system, 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color .2s ease;
    }

    #boot-loader {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      direction: rtl;
      text-align: center;
      padding: 24px;
      gap: 0;
    }
    .boot-mark {
      width: 60px; height: 60px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 800; color: #fff;
      background: var(--accent);
      box-shadow: 0 12px 28px -10px color-mix(in oklab, var(--accent) 65%, transparent);
      margin-bottom: 16px;
    }
    .boot-title { font-size: 19px; font-weight: 800; color: var(--ink); margin-bottom: 4px; letter-spacing: -0.01em; }
    .boot-sub { font-size: 13px; font-weight: 600; color: var(--accent); }
    .boot-bar {
      width: 120px; height: 3px; border-radius: 999px; margin-top: 22px;
      background: color-mix(in oklab, var(--muted) 20%, transparent);
      overflow: hidden;
    }
    .boot-bar::after {
      content: ''; display: block; width: 40%; height: 100%; border-radius: inherit;
      background: var(--accent);
      animation: bootSlide 1.1s ease-in-out infinite;
    }
    @keyframes bootSlide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    #boot-reset-action { display: none; margin-top: 20px; max-width: 280px; }
    #boot-reset-action button {
      width: 100%; background: var(--accent); color: #fff; border: none;
      border-radius: 14px; padding: 12px 16px; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-bar::after { animation: none; width: 100%; }
    }
  </style>

  <script>
    // Apply theme + accent + font size before first paint (no flash).
    (function () {
      var root = document.documentElement;
      try {
        var raw = localStorage.getItem('mct:data');
        var settings = raw ? (JSON.parse(raw) || {}).settings || {} : {};
        var theme = settings.theme || 'auto';
        var isDark = theme === 'dark' ||
          (theme !== 'light' && window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) root.classList.add('dark');
        root.dataset.accent = settings.color || 'blue';
        root.dataset.fs = settings.fs || 'm';
      } catch (e) {
        root.dataset.accent = 'blue';
      }
    })();
  </script>
</head>
<body>
  <div id="root">
    <div id="boot-loader">
      <div class="boot-mark">M</div>
      <div class="boot-title">My-Class-Track</div>
      <div class="boot-sub">دستیار گروه درمانی</div>
      <div class="boot-bar"></div>
      <div id="boot-reset-action">
        <button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}location.reload();">
          پاک‌سازی حافظه و شروع تازه
        </button>
      </div>
    </div>
  </div>

  <script>
    setTimeout(function () {
      var btn = document.getElementById('boot-reset-action');
      if (btn) btn.style.display = 'block';
    }, 4000);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
