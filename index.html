<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="دستیار گروه درمانی — My-Class-Track">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <title>My-Class-Track</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Tahoma', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #020617;
        color: #f8fafc;
      }
    }
    #boot-loader {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      direction: rtl;
      text-align: center;
      padding: 24px;
    }
  </style>
  <script>
    // Clean up stale service workers that may cache old broken scripts
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        }).catch(function() {});
      }
    } catch (e) {}
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
  <div id="root">
    <div id="boot-loader">
      <div style="width: 58px; height: 58px; border-radius: 20px; background: linear-gradient(135deg, #2563eb, #6366f1); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; margin-bottom: 14px; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);">
        M
      </div>
      <div style="font-size: 20px; font-weight: 800; color: #1e293b; margin-bottom: 4px;">
        My-Class-Track
      </div>
      <div style="font-size: 13px; font-weight: 600; color: #2563eb;">
        دستیار گروه درمانی
      </div>
      <div id="boot-reset-action" style="display: none; margin-top: 20px; max-width: 280px;">
        <button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}location.reload();" style="width:100%; background:#2563eb; color:#fff; border:none; border-radius:14px; padding:11px 16px; font-size:13px; font-weight:bold; cursor:pointer; font-family:inherit; box-shadow:0 4px 14px rgba(37,99,235,0.35);">
          🔄 پاکسازی حافظه و شروع تازه
        </button>
      </div>
    </div>
  </div>

  <script>
    setTimeout(function() {
      var btn = document.getElementById('boot-reset-action');
      if (btn) btn.style.display = 'block';
    }, 2000);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
